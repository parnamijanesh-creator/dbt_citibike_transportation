models:
  - name: fct_trips
    columns:
      - name: ride_id
        data_tests:
          - not_null
          - unique
      - name: started_at_key
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_date')
                field: date_key
      - name: ended_at_key
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_date')
                field: date_key
      - name: start_station_key
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_stations')
                field: station_key
      - name: end_station_key
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_stations')
                field: station_key
      - name: rideable_type
        data_tests:
          - accepted_values:
              arguments:
                values:
                  - electric_bike
                  - classic_bike
      - name: member_type
        data_tests:
          - accepted_values:
              arguments:
                values:
                  - member
                  - casual